      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4vmin;
        padding-bottom: 8vh; /* a little above center, like the game */
        background: #000;
        pointer-events: none;
        transition: opacity 0.8s ease-out;
      }
      #boot-screen.boot-screen--done { opacity: 0; }
      #boot-screen .boot-title {
        font-family: 'SpellCraftTitle', serif;
        font-size: min(13vw, 20vh);
        line-height: 1;
        color: #f7d774;
        /* The logo title's sheen (LOGO_CONFIG.title.gradient: angle 135, brightness 0.88 applied to its
           stops, endShade 0.15); keep the two in step by hand */
        background: linear-gradient(90deg, rgba(90, 50, 5, 0.15) 0%, transparent 20%, transparent 80%, rgba(90, 50, 5, 0.15) 100%),
          linear-gradient(135deg, #bc9c4d 0%, #d9bd66 24%, #dfce9b 47%, #d9bd66 68%, #b99646 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 0.15vmin #5a3d0c;
        /* drop-shadows, not text-shadow (which would show through the gradient) */
        filter: drop-shadow(0 0 1.2vmin rgba(255, 220, 120, 0.55)) drop-shadow(0 0.5vmin 0.5vmin rgba(0, 0, 0, 0.8));
      }
      #boot-screen .boot-spinner {
        width: 6vmin;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 0.4vmin solid rgba(247, 215, 116, 0.15);
        border-top-color: #f7d774;
        box-shadow: 0 0 1.5vmin rgba(255, 220, 120, 0.25);
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-screen .boot-spinner { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-hidden="true">
      <div class="boot-title">SpellCraft</div>
      <div class="boot-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
